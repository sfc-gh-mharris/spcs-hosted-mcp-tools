<text x="52" y="44" fill="#000000" font-size="20" font-weight="700">Architecture overview</text>
<text x="52" y="66" fill="#5b5b5b" font-size="14">Three SPCS services. Snowflake calls the public toolset; the server calls Cortex over SQL.</text>
<text x="40" y="136" fill="#5b5b5b" font-size="12" font-weight="700">Outside Snowflake</text>
<rect x="40" y="150" width="170" height="74" rx="8" ry="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="54" y="172" fill="#000000" font-size="14" font-weight="700">Browser</text>
<text x="54" y="192" fill="#5b5b5b" font-size="12">monitor UI</text>
<text x="54" y="209" fill="#5b5b5b" font-size="12">Snowflake sign-in</text>
<rect x="40" y="330" width="170" height="74" rx="8" ry="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="54" y="352" fill="#000000" font-size="14" font-weight="700">CoCo</text>
<text x="54" y="372" fill="#5b5b5b" font-size="12">Cortex Code</text>
<text x="54" y="389" fill="#5b5b5b" font-size="12">MCP client over HTTP</text>
<rect x="285" y="150" width="190" height="74" rx="8" ry="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="299" y="172" fill="#000000" font-size="14" font-weight="700">ui endpoint</text>
<text x="299" y="192" fill="#5b5b5b" font-size="12">public, port 8080</text>
<text x="299" y="209" fill="#5b5b5b" font-size="12">&lt;client-ingress&gt;</text>
<rect x="285" y="330" width="190" height="74" rx="8" ry="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="299" y="352" fill="#000000" font-size="14" font-weight="700">mcp-public endpoint</text>
<text x="299" y="372" fill="#5b5b5b" font-size="12">public, port 8001</text>
<text x="299" y="389" fill="#5b5b5b" font-size="12">&lt;server-ingress&gt;/mcp</text>
<text x="285" y="258" fill="#5b5b5b" font-size="12">Snowflake auth on each request;</text>
<text x="285" y="275" fill="#5b5b5b" font-size="12">adds Sf-Context-Current-User</text>
<rect x="540" y="150" width="350" height="91" rx="8" ry="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="540" y="150" width="4" height="91" rx="2" ry="2" fill="#29b5e8" stroke="none"/>
<text x="554" y="172" fill="#000000" font-size="14" font-weight="700">MCP_CLIENT (Node)</text>
<text x="554" y="192" fill="#5b5b5b" font-size="12">monitor UI, tool forms built from each schema</text>
<text x="554" y="209" fill="#5b5b5b" font-size="12">every tool runs as a background job</text>
<text x="554" y="226" fill="#5b5b5b" font-size="12">Inbound tab: what Snowflake called</text>
<rect x="540" y="300" width="350" height="108" rx="8" ry="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="540" y="300" width="4" height="108" rx="2" ry="2" fill="#29b5e8" stroke="none"/>
<text x="554" y="322" fill="#000000" font-size="14" font-weight="700">MCP_SERVER (Python, mcp SDK 2.3)</text>
<text x="554" y="342" fill="#5b5b5b" font-size="12">port 8001 mcp-public: add</text>
<text x="554" y="359" fill="#5b5b5b" font-size="12">port 8000 mcp, private: every tool, GET /calls</text>
<text x="554" y="376" fill="#5b5b5b" font-size="12">CallRecorder logs calls on both ports</text>
<text x="554" y="393" fill="#5b5b5b" font-size="12">SQL as service user, role MCP_DEMO_ROLE</text>
<rect x="960" y="300" width="170" height="91" rx="8" ry="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="960" y="300" width="4" height="91" rx="2" ry="2" fill="#29b5e8" stroke="none"/>
<text x="974" y="322" fill="#000000" font-size="14" font-weight="700">COCO_WORKER</text>
<text x="974" y="342" fill="#5b5b5b" font-size="12">Agent SDK + cortex CLI</text>
<text x="974" y="359" fill="#5b5b5b" font-size="12">CLI pinned, read-only</text>
<text x="974" y="376" fill="#5b5b5b" font-size="12">POST /run, private</text>
<rect x="285" y="520" width="200" height="74" rx="8" ry="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="299" y="542" fill="#000000" font-size="14" font-weight="700">CUSTOM MCP SERVER</text>
<text x="299" y="562" fill="#5b5b5b" font-size="12">MCP_SERVER_PUBLIC</text>
<text x="299" y="579" fill="#5b5b5b" font-size="12">endpoint mcp-public, /mcp</text>
<rect x="545" y="520" width="190" height="74" rx="8" ry="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="559" y="542" fill="#000000" font-size="14" font-weight="700">Cortex Agent</text>
<text x="559" y="562" fill="#5b5b5b" font-size="12">MCP_DEMO_AGENT</text>
<text x="559" y="579" fill="#5b5b5b" font-size="12">only tool: public add</text>
<rect x="790" y="520" width="335" height="91" rx="8" ry="8" fill="#11567f" stroke="none"/>
<text x="804" y="542" fill="#ffffff" font-size="14" font-weight="700">Snowflake Cortex</text>
<text x="804" y="562" fill="#dbeaf3" font-size="12">AI_COMPLETE, AI_CLASSIFY, AI_SENTIMENT</text>
<text x="804" y="579" fill="#dbeaf3" font-size="12">DATA_AGENT_RUN, AGENT_RUN (code_toolset_all)</text>
<text x="804" y="596" fill="#dbeaf3" font-size="12">Cortex Code service for the CLI</text>
<rect x="285" y="650" width="450" height="91" rx="8" ry="8" fill="#f0f9ff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="299" y="672" fill="#000000" font-size="14" font-weight="700">Roles</text>
<text x="299" y="692" fill="#5b5b5b" font-size="12">MCP_DEMO_ROLE owns the services, the agent, the warehouse</text>
<text x="299" y="709" fill="#5b5b5b" font-size="12">MCP_DEMO_CONSUMER_ROLE: six grants,</text>
<text x="299" y="726" fill="#5b5b5b" font-size="12">including the service role mcp_consumer</text>
<rect x="790" y="650" width="335" height="91" rx="8" ry="8" fill="#f0f9ff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="804" y="672" fill="#000000" font-size="14" font-weight="700">Warehouse MCP_DEMO_WH</text>
<text x="804" y="692" fill="#5b5b5b" font-size="12">X-Small, AUTO_SUSPEND 60 s</text>
<text x="804" y="709" fill="#5b5b5b" font-size="12">the QUERY_WAREHOUSE of</text>
<text x="804" y="726" fill="#5b5b5b" font-size="12">MCP_SERVER and COCO_WORKER</text>
<text x="82" y="544" fill="#5b5b5b" font-size="12">Ingress, Snowflake auth</text>
<text x="82" y="568" fill="#5b5b5b" font-size="12">Snowflake session token</text>
<text x="82" y="592" fill="#5b5b5b" font-size="12">Private service network</text>
<rect x="226.6" y="178" width="41.8" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
<text x="247.5" y="191" fill="#5b5b5b" font-size="12" text-anchor="middle">HTTPS</text>
<rect x="226.6" y="358" width="41.8" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
<text x="247.5" y="371" fill="#5b5b5b" font-size="12" text-anchor="middle">token</text>
<rect x="652.76" y="261.5" width="124.48" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
<text x="715" y="274.5" fill="#5b5b5b" font-size="12" text-anchor="middle">MCP and GET /calls</text>
<rect x="891.38" y="336" width="67.24" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
<text x="925" y="349" fill="#5b5b5b" font-size="12" text-anchor="middle">coco_task</text>
<rect x="590.48" y="445" width="99.04" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
<text x="640" y="458" fill="#5b5b5b" font-size="12" text-anchor="middle">DATA_AGENT_RUN</text>
<rect x="766.86" y="445" width="156.28" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
<text x="845" y="458" fill="#5b5b5b" font-size="12" text-anchor="middle">AI functions, AGENT_RUN</text>
<rect x="987.76" y="445" width="124.48" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
<text x="1050" y="458" fill="#5b5b5b" font-size="12" text-anchor="middle">CLI, session token</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880">
<style>text { font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; }</style>
<defs>
<marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#29b5e8"/></marker>
<marker id="a-mid" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#11567f"/></marker>
<marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#5b5b5b"/></marker>
</defs>
<rect width="1200" height="880" fill="#ffffff"/>
<rect x="40" y="24" width="4" height="28" rx="2" fill="#29b5e8"/>
<line x1="140" y1="156" x2="140" y2="730" stroke="#b6c2cf" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="460" y1="156" x2="460" y2="730" stroke="#b6c2cf" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="780" y1="156" x2="780" y2="730" stroke="#b6c2cf" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="1060" y1="156" x2="1060" y2="730" stroke="#b6c2cf" stroke-width="1" stroke-dasharray="4,4"/>
<rect x="455" y="290" width="10" height="334" rx="2" ry="2" fill="#f0f9ff" stroke="#11567f" stroke-width="1"/>
<rect x="775" y="290" width="10" height="270" rx="2" ry="2" fill="#f0f9ff" stroke="#11567f" stroke-width="1"/>
<rect x="1055" y="340" width="10" height="170" rx="2" ry="2" fill="#f0f9ff" stroke="#11567f" stroke-width="1"/>
<rect x="50" y="372" width="500" height="104" rx="4" ry="4" fill="none" stroke="#11567f" stroke-width="1"/>
<rect x="50" y="372" width="217.6" height="20" rx="4" ry="4" fill="#f0f9ff" stroke="#11567f" stroke-width="1"/>
<text x="58" y="386" fill="#11567f" font-size="12" font-weight="700">loop every 2 s while running</text>
<path d="M 146,200 L 454,200" fill="none" stroke="#29b5e8" stroke-width="2" marker-end="url(#a-blue)"/>
<path d="M 454,240 L 146,240" fill="none" stroke="#5b5b5b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a-gray)"/>
<path d="M 466,290 L 774,290" fill="none" stroke="#5b5b5b" stroke-width="1.5" marker-end="url(#a-gray)"/>
<path d="M 786,340 L 1054,340" fill="none" stroke="#11567f" stroke-width="2" marker-end="url(#a-mid)"/>
<path d="M 146,420 L 454,420" fill="none" stroke="#29b5e8" stroke-width="2" marker-end="url(#a-blue)"/>
<path d="M 454,458 L 146,458" fill="none" stroke="#5b5b5b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a-gray)"/>
<path d="M 1054,510 L 786,510" fill="none" stroke="#5b5b5b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a-gray)"/>
<path d="M 774,560 L 466,560" fill="none" stroke="#5b5b5b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a-gray)"/>
<path d="M 466,590 L 504,590 L 504,612 L 467,612" fill="none" stroke="#5b5b5b" stroke-width="1.5" marker-end="url(#a-gray)"/>
<path d="M 146,660 L 454,660" fill="none" stroke="#29b5e8" stroke-width="2" marker-end="url(#a-blue)"/>
<path d="M 454,700 L 146,700" fill="none" stroke="#5b5b5b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a-gray)"/>
<text x="52" y="44" fill="#000000" font-size="20" font-weight="700">Long tool calls: background jobs and polling</text>
<text x="52" y="66" fill="#5b5b5b" font-size="14">No hop waits on a slow Cortex call, so no timeout along the way can cut it.</text>
<rect x="50" y="100" width="180" height="56" rx="8" ry="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="64" y="122" fill="#000000" font-size="14" font-weight="700">Browser</text>
<text x="64" y="142" fill="#5b5b5b" font-size="12">monitor UI</text>
<rect x="370" y="100" width="180" height="56" rx="8" ry="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="370" y="100" width="4" height="56" rx="2" ry="2" fill="#29b5e8" stroke="none"/>
<text x="384" y="122" fill="#000000" font-size="14" font-weight="700">MCP_CLIENT</text>
<text x="384" y="142" fill="#5b5b5b" font-size="12">Node, job runner</text>
<rect x="690" y="100" width="180" height="56" rx="8" ry="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="690" y="100" width="4" height="56" rx="2" ry="2" fill="#29b5e8" stroke="none"/>
<text x="704" y="122" fill="#000000" font-size="14" font-weight="700">MCP_SERVER</text>
<text x="704" y="142" fill="#5b5b5b" font-size="12">private, port 8000</text>
<rect x="970" y="100" width="180" height="56" rx="8" ry="8" fill="#11567f" stroke="none"/>
<text x="984" y="122" fill="#ffffff" font-size="14" font-weight="700">Snowflake Cortex</text>
<text x="984" y="142" fill="#dbeaf3" font-size="12">or COCO_WORKER</text>
<rect x="40" y="760" width="1120" height="91" rx="8" ry="8" fill="#f0f9ff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="54" y="782" fill="#000000" font-size="14" font-weight="700">Limits each hop stays under</text>
<text x="54" y="802" fill="#5b5b5b" font-size="12">Browser to MCP_CLIENT: SPCS ingress drops idle connections after 90 s, so every request returns at once and the UI polls.</text>
<text x="54" y="819" fill="#5b5b5b" font-size="12">MCP_CLIENT to MCP_SERVER: per-tool timeouts replace the MCP SDK's 60 s default; an undici dispatcher lifts Node fetch's 300 s header limit.</text>
<text x="54" y="836" fill="#5b5b5b" font-size="12">MCP_SERVER to Cortex: DATA_AGENT_RUN is synchronous with a 15-minute limit, which sets the agent tools' timeout.</text>
<rect x="209.14" y="179" width="181.72" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
<text x="300" y="192" fill="#5b5b5b" font-size="12" text-anchor="middle">POST /api/jobs {tool, args}</text>
<rect x="212.32" y="219" width="175.36" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
<text x="300" y="232" fill="#5b5b5b" font-size="12" text-anchor="middle">202 at once: a running row</text>
<rect x="503.7" y="269" width="232.6" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
<text x="620" y="282" fill="#5b5b5b" font-size="12" text-anchor="middle">tools/call, timeout 120 s or 15 min</text>
<rect x="822.78" y="319" width="194.44" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
<text x="920" y="332" fill="#5b5b5b" font-size="12" text-anchor="middle">one SQL call, can run minutes</text>
<rect x="215.5" y="399" width="169" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
<text x="300" y="412" fill="#5b5b5b" font-size="12" text-anchor="middle">GET /api/calls?sinceRev=N</text>
<rect x="225.04" y="437" width="149.92" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
<text x="300" y="450" fill="#5b5b5b" font-size="12" text-anchor="middle">only rows that changed</text>
<rect x="867.3" y="489" width="105.4" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
<text x="920" y="502" fill="#5b5b5b" font-size="12" text-anchor="middle">one JSON result</text>
<rect x="580.02" y="539" width="79.96" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
<text x="620" y="552" fill="#5b5b5b" font-size="12" text-anchor="middle">tool result</text>
<rect x="509" y="592" width="149.92" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
<text x="514" y="605" fill="#5b5b5b" font-size="12">call log: revision + 1</text>
<rect x="215.5" y="639" width="169" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
<text x="300" y="652" fill="#5b5b5b" font-size="12" text-anchor="middle">GET /api/calls?sinceRev=N</text>
<rect x="215.5" y="679" width="169" height="18" rx="3" ry="3" fill="#ffffff" stroke="none"/>
<text x="300" y="692" fill="#5b5b5b" font-size="12" text-anchor="middle">row done, with the result</text>
</svg>

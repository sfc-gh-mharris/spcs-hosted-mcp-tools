[project]
name = "coco-worker"
version = "0.1.0"
description = "Runs Cortex Code (the cortex CLI) through the Cortex Agent SDK inside Snowpark Container Services"
requires-python = ">=3.11"
dependencies = [
    "snowflake-cortex-agent-sdk==0.0.3",
    "starlette>=0.52.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: runs the real cortex CLI (needs COCO_LIVE=1 and SNOW_CONNECTION)"]

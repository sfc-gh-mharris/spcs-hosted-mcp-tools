[project]
name = "mcp-server"
version = "0.1.0"
description = "Minimal MCP server (add tool) for Snowpark Container Services"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
